name: ptn_admin_dashboard
description: "PitonPass real-time administration dashboard."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.11.5 <4.0.0'

dependencies:
  cloud_firestore: ^6.8.0
  firebase_core: ^4.13.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  easy_localization: ^3.0.7
  flutter_hooks: ^0.21.3+1
  flutter_screenutil: ^5.9.3
  hooks_riverpod: ^3.3.2
  firebase_auth: ^6.5.7
  fpdart: ^1.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  fl_chart: ^1.2.0
  go_router: ^17.5.0
  get_it: ^8.0.3
  injectable: ^2.5.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  injectable_generator: ^2.6.2
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/lang/
    - assets/icons/
